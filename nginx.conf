server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # A `types {}` block in a server context REPLACES the inherited map
    # rather than extending it — re-including the stock list first (so
    # .js/.css/.html etc. keep working) and only then adding the glTF/GLB
    # types nginx doesn't ship with. Babylon's SceneLoader parses these fine
    # regardless of Content-Type (it sniffs the GLB magic header / goes by
    # URL extension), but strict browser fetch paths and future tooling are
    # happier with the real type.
    include /etc/nginx/mime.types;
    types {
        model/gltf+json     gltf;
        model/gltf-binary   glb;
        application/wasm    wasm;
    }

    # No build step / no cache-busted filenames in this project (see
    # CLAUDE.md) — index.html and the ES module graph under src/ must never
    # be cached, or a deploy can leave a browser running a stale mix of old
    # and new modules, which looks like "the game is broken" without ever
    # throwing a console error.
    location ~* \.(?:html|js|css)$ {
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0";
        add_header Pragma "no-cache";
    }

    # Character/prop models + textures are large (tens of MB) and change
    # rarely — cache them for real to avoid re-downloading the whole asset
    # pack on every visit. Bump this (or add a query-string version) if an
    # asset ever needs to be force-refreshed for returning players.
    location /assets/ {
        add_header Cache-Control "public, max-age=86400";
    }

    # ── Compression ───────────────────────────────────────────────────────────
    # The single biggest local-vs-deployed difference: over localhost an
    # uncompressed payload costs nothing, over the wire it costs seconds.
    # This project ships 52 unbundled ES modules (~656 KB raw) and glTF, which
    # is JSON and compresses ~27x (AnimationLibrary.gltf: 2.46 MB -> 90 KB).
    #
    # gzip_static serves the .gz files the Dockerfile precompresses at build
    # time (zero per-request CPU, gzip -9 ratios); `gzip on` is the fallback
    # for anything that has no .gz sibling. Deliberately NOT gzipping image/png
    # — PNG is already DEFLATE-compressed, so it burns CPU for ~0 bytes saved.
    gzip_static on;
    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_proxied any;
    # text/html is always gzipped by nginx and must not be listed here.
    gzip_types text/plain
               text/css
               text/javascript
               application/javascript
               application/json
               image/svg+xml
               application/wasm
               model/gltf+json
               application/octet-stream;

    location / {
        try_files $uri $uri/ =404;
    }
}
